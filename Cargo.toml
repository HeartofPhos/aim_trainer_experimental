[workspace]
resolver = "3"
members = ["crates/aim_game","crates/aim_trainer", "crates/ref_asset", "crates/schema"]

[workspace.dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "bevy_log",
    "debug",
    "track_location",
] }
bevy_math = { version = "0.19" }

avian3d = { version = "0.7.0", default-features = false, features = [
    "3d",
    "f32",
    "parry-f32",
    "default-collider",
    "enhanced-determinism",
] }
bevy_rand = { version = "0.15", features = ["wyrand"] }
rand = { version = "0.10", default-features = false }
derive_more = { version = "2", default-features = false, features = [
    "from",
    "mul",
    "eq",
    "debug",
] }
serde = { version = "^1.0.220", features = ["derive"] }
serde_json = { version = "1.0.145", features = [
    "arbitrary_precision",
    "preserve_order",
] }
raylib = { version = "6.0.0", features = ["log", "glam"] }
serde_with = "3.12.0"
thiserror = "2.0"
log = { version = "*", features = [
    "max_level_debug",
    "release_max_level_warn",
] }
extend = "1.2"
jiff = { version = "0.2", features = ["js"] }
approx = "0.5"

[patch.crates-io]
raylib = { git = 'https://github.com/HeartofPhos/raylib-rs.git', branch = 'unstable' }
avian3d = { git = 'https://github.com/HeartofPhos/avian.git', branch = 'release-v0.7.0' }

# Idiomatic Bevy code often triggers these lints, and the CI workflow treats them as errors.
# In some cases they may still signal poor code quality however, so consider commenting out these lines.
[workspace.lints.clippy]
# Bevy supplies arguments to systems via dependency injection, so it's natural for systems to
# request more than 7 arguments -- which triggers this lint.
too_many_arguments = "allow"
# Queries that access many components may trigger this lint.
type_complexity = "allow"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"
